<!DOCTYPE html>
<html lang="ko" data-theme="luxury">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Golden Potato Awards</title>

    <!-- Favicon -->
    <link rel="icon" href="/src/favicon.ico" sizes="any">
    <link rel="icon" type="image/svg+xml" href="/src/favicon.svg">
    <link rel="apple-touch-icon" href="/src/favicon.ico">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Gowun+Batang&family=Noto+Sans+KR:wght@100..900&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">

    <!-- Tailwind + DaisyUI -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        plugins: [daisyui],
      }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/daisyui@4.12.10/dist/full.js"></script>

    <!-- Animate.css -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"
    />

    <!-- Custom Styles -->
    <link rel="stylesheet" href="styles.css">

    <!-- Tailwind Custom Config -->
    <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            title: ["'Playfair Display', serif"],
            subtitle: ["'Gowun Batang', sans-serif"],
            content: ["'Noto Sans KR', sans-serif"],
          },
          keyframes: {
            gradient: {
              "0%,100%": { transform: "translate(0,0)" },
              "50%": { transform: "translate(-10%, -10%)" },
            },
            gradientReverse: {
              "0%,100%": { transform: "translate(0,0)" },
              "50%": { transform: "translate(10%, 10%)" },
            },
            pulseSlow: {
              "0%,100%": { opacity: "0.4" },
              "50%": { opacity: "0.7" },
            },
            sparkle: {
              "0%": { opacity: "0", transform: "scale(0.8) translateY(0)" },
              "50%": { opacity: "0.8" },
              "100%": { opacity: "0", transform: "scale(1.2) translateY(-20px)" },
            },
          },
          animation: {
            gradient: "gradient 18s ease-in-out infinite",
            "gradient-reverse": "gradientReverse 22s ease-in-out infinite",
            "pulse-slow": "pulseSlow 8s ease-in-out infinite",
            sparkle: "sparkle var(--duration) ease-in-out infinite",
          },
          colors: {
            primary: "#FFB22C",
            secondary: "#854836",
            text_main: "#F5E7C6",
            text_muted:  "#A1A1AA",
            accent: "#FDE68A",
            white: "#FFFFFF",
            dark: "#000000",
          },
        },
      },
    }
  </script>
  </head>

  
<body class="bg-slate-950 text-white overflow-hidden min-h-screen flex flex-col">

  <!-- Particles Background -->
  <div id="particle-bg" class="fixed inset-0 pointer-events-none">

    <!-- Glow blobs -->
    <div class="absolute top-0 left-1/4 w-[600px] h-[600px]
      bg-primary/35 rounded-full blur-[120px]
      animate-pulse-slow"></div>

    <div class="absolute bottom-0 right-1/4 w-[700px] h-[700px]
      bg-yellow-500/35 rounded-full blur-[120px]
      animate-pulse-slow"></div>

  </div>

  <!-- Particles JS -->
  <script>
  const container = document.getElementById("particle-bg");

  for (let i = 0; i < 50; i++) {
    const p = document.createElement("div");

    const size = 2 + Math.random() * 3;
    const duration = 2 + Math.random() * 2;
    const delay = Math.random() * 3;

    p.className =
      "absolute rounded-full bg-primary/80 blur-[1px] opacity-0 animate-sparkle";

    p.style.left = Math.random() * 100 + "%";
    p.style.top = Math.random() * 100 + "%";
    p.style.width = size + "px";
    p.style.height = size + "px";
    p.style.animationDelay = delay + "s";
    p.style.setProperty("--duration", duration + "s");

    container.appendChild(p);
  }
</script>


  <!-- Content -->
  <main class="relative z-10 flex-1 flex-col items-center justify-center p-10">

    <!-- Header -->
    <header>
      <h1 class="bg-gradient-to-r from-primary via-accent to-secondary 
              bg-clip-text text-transparent text-6xl font-title font-bold text-center">
      Golden Potato Awards
      </h1>
      <p class="font-subtitle text-main text-center mt-4 mb-8">
        2022년부터 시작된 최고의 미디어 시상식
      </p>

    </header>

    <!-- Main Content -->


  

  </main>

    <p class="font-bold">
